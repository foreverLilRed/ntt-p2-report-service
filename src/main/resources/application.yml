spring:
  application:
    name: report-service
  config:
    import: optional:configserver:http://localhost:8888

server:
  port: 8084

services:
  account:
    base-url: http://localhost:8082
  credit:
    base-url: http://localhost:8083

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    enabled: ${EUREKA_ENABLED:true}
